name: Neuquen IPC source archaeology

on:
  push:
    branches:
      - probe/neuquen-current-series

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect calculator API payload without Referer
        run: |
          python - <<'PY'
          import json
          import urllib.request
          url='https://www.estadisticaneuquen.gob.ar/apps/calculadora/php/api.php'
          req=urllib.request.Request(url,headers={'User-Agent':'IPC-Argentina-source-archaeology/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              raw=r.read()
              print('status',r.status,'final',r.geturl(),'type',r.headers.get('Content-Type'),'bytes',len(raw))
          data=json.loads(raw)
          print('payload_type',type(data).__name__,'rows',len(data) if isinstance(data,list) else None)
          if isinstance(data,list) and data:
              print('keys',sorted(data[0]))
              print('first',json.dumps(data[0],ensure_ascii=False,sort_keys=True))
              print('last',json.dumps(data[-1],ensure_ascii=False,sort_keys=True))
          else:
              print(json.dumps(data,ensure_ascii=False,sort_keys=True)[:10000])
          PY
