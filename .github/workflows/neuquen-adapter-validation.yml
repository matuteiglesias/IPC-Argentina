name: Neuquen adapter validation

on:
  push:
    branches:
      - feat/neuquen-calculator-json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline contracts and tests
        run: |
          make check
          make test-price
      - name: Acquire and verify live source lock
        run: |
          make price-source-lock
          make price-source-lock-check
      - name: Install workbook adapters
        run: python -m pip install -r requirements-source.txt
      - name: Build and validate full v2 chain
        run: |
          make price-v2-build SOURCE_LOCK=build/price_sources/source_lock.json
          make price-v2-check
          make price-v2-approved-check
      - name: Print Neuquen and latest consensus evidence
        if: always()
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          lock=json.loads(Path('build/price_sources/source_lock.json').read_text())
          neuquen=next((e for e in lock['entries'] if e['source_id']=='neuquen_ipc_provincial'),None)
          print('NEUQUEN_LOCK',json.dumps(neuquen,ensure_ascii=False,sort_keys=True))
          roots=sorted(Path('artifacts/price_v2/consensus').glob('*')) if Path('artifacts/price_v2/consensus').exists() else []
          if roots:
              latest_root=roots[-1]
              print('CONSENSUS_QA', (latest_root/'qa.json').read_text())
              rows=list(csv.DictReader((latest_root/'monthly_consensus.csv').open()))
              if rows: print('LATEST_CONSENSUS',json.dumps(rows[-1],ensure_ascii=False,sort_keys=True))
          PY
