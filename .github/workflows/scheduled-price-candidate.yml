name: Scheduled price-source convergence

on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1"

permissions:
  contents: read

concurrency:
  group: scheduled-price-source-convergence
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify committed snapshot
        run: make check

      - name: Discover and lock available source bytes once
        run: make price-source-lock

      - name: Verify source lock
        run: make price-source-lock-check

      - name: Require the current national anchor
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("build/price_sources/source_lock.json").read_text())
          entries = {entry["source_id"]: entry for entry in lock["entries"]}
          national = entries.get("indec_ipc_national")
          if not national or national.get("status") != "pinned":
              raise SystemExit("current_national_anchor_unavailable: indec_ipc_national was not pinned")
          print("current national IPC anchor pinned:", national["sha256"])
          PY

      - name: Build current candidate envelope
        run: make price-candidate

      - name: Apply current consumer maturity gate
        run: make price-candidate-check

      - name: Require a source-backed candidate before calling convergence green
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          releases = sorted(Path("artifacts/price_releases").glob("*/manifest.json"))
          if not releases:
              raise SystemExit("price_candidate_missing")
          manifest = json.loads(releases[-1].read_text())
          qa = json.loads((releases[-1].parent / "qa.json").read_text())
          warnings = set(manifest.get("warnings", []))
          if qa.get("normalized_source_rows", 0) <= 0 or "historical_source_hash_not_retained" in warnings:
              raise SystemExit(
                  "source_backed_price_candidate_missing: live sources can be pinned, "
                  "but candidate materialization still wraps the retained legacy composite"
              )
          print("source-backed price candidate eligible for downstream review")
          PY

      - name: Summarize maintenance state
        if: always()
        run: |
          {
            echo "## Scheduled IPC candidate convergence"
            echo
            echo "This workflow executes one exact source discovery/download → lock → candidate → consumer-preflight path and requires the national current anchor. It does not probe and then re-download the same dynamic sources a second time."
            echo
            echo "A red source-backed-candidate gate is expected until live locked sources actually feed candidate materialization; it must not be hidden by the retained legacy fallback."
            echo
            echo '```text'
            find build/price_sources artifacts/price_releases -maxdepth 4 -type f -printf '%p\n' 2>/dev/null | sort | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source and candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipc-maintenance-candidate
          path: |
            build/price_sources
            artifacts/price_releases
          if-no-files-found: warn
          retention-days: 14
