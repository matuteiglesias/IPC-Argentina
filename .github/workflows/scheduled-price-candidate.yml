name: Scheduled IPC v2 convergence

on:
  workflow_dispatch:
    inputs:
      mode:
        description: How far to run the governed price chain
        required: true
        default: full-v2
        type: choice
        options:
          - full-v2
          - source-only
      require_approved_latest:
        description: Fail unless the latest consensus month has at least three eligible panel members
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "37 9 * * 1"

permissions:
  contents: write

concurrency:
  group: scheduled-price-v2-convergence
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify offline snapshot and price contracts
        run: |
          make check
          make test-price

      - name: Acquire exact declared source bytes once
        run: make price-source-lock

      - name: Verify relocatable source lock
        run: make price-source-lock-check

      - name: Install bounded workbook adapters
        if: github.event_name == 'schedule' || inputs.mode == 'full-v2'
        run: python -m pip install -r requirements-source.txt

      - name: Build normalized sources, v2 consensus and conversion candidates
        if: github.event_name == 'schedule' || inputs.mode == 'full-v2'
        run: make price-v2-build SOURCE_LOCK=build/price_sources/source_lock.json

      - name: Independently validate all v2 candidate releases
        if: github.event_name == 'schedule' || inputs.mode == 'full-v2'
        run: make price-v2-check

      - name: Package immutable conversion candidate
        if: github.event_name == 'schedule' || inputs.mode == 'full-v2'
        run: |
          conversion=$(find artifacts/price_v2/conversion -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
          test -n "$conversion"
          python scripts/package_v2_candidate.py "$conversion" --output build/publication
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path('build/publication/discovery.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f"PUBLICATION_TAG={d['github_release']['tag']}\n")
              f.write(f"PUBLICATION_ASSET={d['github_release']['asset_name']}\n")
              f.write(f"PUBLICATION_RELEASE_ID={d['release_id']}\n")
          PY

      - name: Publish or verify immutable GitHub Release transport
        if: github.event_name == 'schedule' || inputs.mode == 'full-v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          asset="build/publication/$PUBLICATION_ASSET"
          discovery="build/publication/discovery.json"
          if gh release view "$PUBLICATION_TAG" >/dev/null 2>&1; then
            mkdir -p build/existing-release
            gh release download "$PUBLICATION_TAG" -p "$PUBLICATION_ASSET" -p discovery.json -D build/existing-release
            cmp "$asset" "build/existing-release/$PUBLICATION_ASSET"
            cmp "$discovery" build/existing-release/discovery.json
            echo "Existing immutable release matches byte-for-byte: $PUBLICATION_TAG"
          else
            gh release create "$PUBLICATION_TAG" "$asset" "$discovery" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$PUBLICATION_RELEASE_ID (candidate)" \
              --notes "Immutable candidate transport for research.argentina-monetary-conversion/v1. Candidate publication is not scientific approval."
          fi

      - name: Assess scheduled candidate maturity
        id: scheduled_maturity
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: make price-v2-approved-check

      - name: Apply explicitly requested maturity gate
        if: github.event_name == 'workflow_dispatch' && inputs.require_approved_latest
        run: make price-v2-approved-check

      - name: Summarize maintenance state
        if: always()
        run: |
          {
            echo "## IPC v2 convergence"
            echo
            echo "Event: **${{ github.event_name }}**"
            echo "Manual mode: **${{ inputs.mode || 'scheduled-full-v2' }}**"
            echo "Scheduled maturity assessment: **${{ steps.scheduled_maturity.outcome || 'not-run' }}**"
            echo
            echo "The fixed panel is INDEC, CABA, Córdoba, San Luis and Neuquén. Missing members lower coverage; they are never replaced dynamically by another province."
            echo
            echo "A validated conversion candidate is published as an immutable prerelease before the separate latest-period maturity assessment. Scheduled thin coverage remains visible but does not fail candidate publication; an explicitly requested approval gate remains fail-closed. Candidate publication never upgrades scientific status."
            echo
            echo '```text'
            find build/price_sources artifacts/price_v2 build/publication -maxdepth 5 -type f -printf '%p\n' 2>/dev/null | sort | head -300 || true
            echo '```'
            if [ -d artifacts/price_v2/consensus ]; then
              latest=$(find artifacts/price_v2/consensus -mindepth 1 -maxdepth 1 -type d | sort | tail -1)
              if [ -n "$latest" ] && [ -f "$latest/qa.json" ]; then
                echo
                echo "### Latest consensus QA"
                echo '```json'
                cat "$latest/qa.json"
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact source and v2 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipc-v2-maintenance-candidate
          path: |
            build/price_sources
            artifacts/price_v2
            build/publication
          if-no-files-found: warn
          retention-days: 14
